name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run --python ${{ matrix.python }} ruff check data_harness tests
      - run: uv run --python ${{ matrix.python }} ruff format --check data_harness tests
      - run: uv run --python ${{ matrix.python }} pytest tests/ -m "not live"

  # Mirrors the build step in docs.yml (mkdocs gh-deploy runs `mkdocs build`
  # internally). Without this, a broken mkdocstrings reference only surfaces
  # after merging to main, when the separate deploy workflow fails silently
  # with nobody watching it.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group docs
      - run: uv run --group docs mkdocs build
